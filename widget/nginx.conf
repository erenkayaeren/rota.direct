server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  # The widget bundle: hotel sites on other origins load it. no-cache = revalidate on every load
  # (cheap 304 via ETag), so a fixed widget reaches every hotel immediately. A production setup
  # would version the URL (widget.<hash>.js) and cache it for a year.
  location = /widget.js {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location = /widget.js.map {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location / { try_files $uri $uri/ =404; }
}
